[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmg-export-forecasting-bangladesh"
version = "0.1.0"
description = "Monthly Bangladesh RMG export forecasting framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "statsmodels>=0.14", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
